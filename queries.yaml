# queries.yaml — the source of truth for the query layer.
# py/build_sparql.py turns this into docs/sparql.html, the plain .rq files
# under docs/downloads/queries/ and the quarto-live notebook in qmd/, so the
# three cannot drift apart. Every query below is executed against the real
# graph at build time; one that returns no rows fails the build.

graph:
  file: rdf/IPSDatedSites-bundle.ttl
  url: bundle.ttl
  publish: true

page:
  title: "Query the dating graph"
  intro: >-
    The box plot in this repository is not drawn from a spreadsheet: it is
    drawn from a graph, and every number in it can be asked for directly.
    The queries below are editable and run in your browser.
  vocabulary_note: >-
    Vocabulary: <code>rdf/lado_dating_extension.ttl</code>, extending
    <a href="http://www.cidoc-crm.org/">CIDOC CRM</a>,
    <a href="https://www.w3.org/TR/owl-time/">OWL-Time</a> and
    <a href="https://www.w3.org/TR/prov-o/">PROV-O</a>. The bundle carries
    the vocabulary and a materialised CRM crosswalk, so it can be loaded
    into a triplestore on its own.
  nav:
    - {href: "index.html", label: "Overview"}
    - {href: "model.html", label: "Model"}
    - {href: "sparql.html", label: "Query", active: true}

qmd:
  file: ips-dated-sites-sparql-live.qmd
  title: "Querying the IPS dated sites graph"
  graph_url: "https://leiza-rse.github.io/IPSDatedSites/bundle.ttl"
  about: >-
    A browser notebook over the IPS dated sites graph: Roman findspots dated
    from samian potters' stamps, published as Linked Open Data. Nothing is
    installed and nothing is sent anywhere — the graph is fetched as a
    static file and queried locally with rdflib under Pyodide.
  notes: |
    ## What this dataset is

    Each row is one findspot at one site, dated from the samian potters'
    stamps found there. A potter's production period is known from other
    evidence; a findspot that yields stamps of several potters can
    therefore be dated by combining them.

    The interval is deliberately **not** a confidence interval. It is a
    "virtual fuzzy year", `m ± k·σ`, where σ decomposes into the inner
    fuzziness of each potter's own date range and the scatter of those
    ranges' midpoints, and `k` shrinks as the number of stamps grows.
    Treating it as a statistical confidence bound would claim far more
    than the archaeology supports.

    ## Two things worth noticing

    Dating sharpness (`lado:qInterval`) and depot character
    (`lado:qRepetition`) are kept as **separate axes** and never combined
    into a single score. Multiplying them would zero out well dated sites
    that happen to yield each stamp once.

    Negative years are handled in two places at once, on purpose. The
    arithmetic runs on a signed number line with its own declared time
    reference system (`samian:trs_ips_year`), which is never shifted; the
    calendar reading is attached separately as `time:inXSDgYear`. Shifting
    only the negative values would tear the scale apart at zero.

# --------------------------------------------------------------------------
# The map (py/build_map.py -> docs/map.html + docs/map.geojson)
# --------------------------------------------------------------------------
# This query runs once at build time and its result becomes the GeoJSON the
# map page reads. It is here rather than inside the Python so that changing
# what the map shows is an edit to a query, not to a program — and so that
# the page can print the query it was built from.
#
# One row per findspot AND axis: the four axes are unfolded with VALUES so
# that adding an axis in py/ips_colour.py needs no change here beyond the
# list below.
map:
  title: "Where the dated findspots are"
  intro: >-
    The same 41 findspots the box plot draws, on a map, shaded by any of the
    four colour axes the graph publishes. The colours are not chosen here:
    each axis carries its ramp, its interpolation and its normalisation
    domain in the graph itself, so every colour on this map can be
    recomputed from the data behind it.
  default_axis: qInterval
  axis_labels:
    qInterval: "Dating sharpness"
    midpointYear: "Chronology (midpoint)"
    sigmaYears: "Dispersion (sigma)"
    nStamps: "Number of stamps"
  sparql: |
    SELECT ?site ?findspot ?wkt ?from ?to ?axis ?norm ?colour WHERE {
      VALUES (?axis ?normProp ?hexProp) {
        ("qInterval"    lado:normQInterval    lado:hexQInterval)
        ("midpointYear" lado:normMidpointYear lado:hexMidpointYear)
        ("sigmaYears"   lado:normSigmaYears   lado:hexSigmaYears)
        ("nStamps"      lado:normNStamps      lado:hexNStamps)
      }
      ?fs a lado:Findspot ; rdfs:label ?findspot ;
          crm:P89_falls_within ?p ; crm:P4_has_time-span ?ts .
      ?p rdfs:label ?site ; geo:hasGeometry/geo:asWKT ?wkt .
      ?ts time:hasBeginning/time:inTimePosition/time:numericPosition ?from ;
          time:hasEnd/time:inTimePosition/time:numericPosition ?to .
      ?row lado:renders ?ts ; ?normProp ?norm ; ?hexProp ?colour .
    }
    ORDER BY ?site ?findspot ?axis

prefixes: |
  PREFIX samian:  <http://data.archaeology.link/data/samian/>
  PREFIX lado:    <http://archaeology.link/ontology#>
  PREFIX crm:     <http://www.cidoc-crm.org/cidoc-crm/>
  PREFIX crmdig:  <http://www.ics.forth.gr/isl/CRMdig/>
  PREFIX time:    <http://www.w3.org/2006/time#>
  PREFIX prov:    <http://www.w3.org/ns/prov#>
  PREFIX dcat:    <http://www.w3.org/ns/dcat#>
  PREFIX dcterms: <http://purl.org/dc/terms/>
  PREFIX skos:    <http://www.w3.org/2004/02/skos/core#>
  PREFIX geo:     <http://www.opengis.net/ont/geosparql#>
  PREFIX rdfs:    <http://www.w3.org/2000/01/rdf-schema#>
  PREFIX xsd:     <http://www.w3.org/2001/XMLSchema#>

queries:
  - id: dated-findspots
    title: "The figure, as a table"
    intro: >-
      Every row of the box plot, in the order the figure draws them. The
      interval bounds come out of OWL-Time rather than from a column: the
      time-span has a beginning and an end, each of which is an instant
      holding a numeric position on a named scale. That indirection is what
      lets the calendar reading and the arithmetic position disagree about
      negative years without either being wrong.
    sparql: |
      SELECT ?site ?findspot ?from ?to ?span ?qInterval ?nStamps WHERE {
        ?fs a lado:Findspot ; rdfs:label ?findspot ;
            crm:P89_falls_within ?p ; crm:P4_has_time-span ?ts .
        ?p rdfs:label ?site .
        ?ts time:hasBeginning/time:inTimePosition/time:numericPosition ?from ;
            time:hasEnd/time:inTimePosition/time:numericPosition ?to ;
            lado:qInterval ?qInterval ; lado:nStamps ?nStamps ;
            lado:avgDatemin ?order .
        BIND(?to - ?from AS ?span)
      }
      ORDER BY ?order

  - id: crm-only
    title: "The same answer in CIDOC CRM alone"
    intro: >-
      No lado: and no time: term appears below, only CIDOC CRM — and it
      still returns all 41 findspots with their dates. That is the point of
      the materialised crosswalk: most triplestores perform no RDFS
      entailment, so the inferred rdf:type triples are written out
      explicitly rather than left to a reasoner that may never run. Load
      the vocabulary alone and this query returns nothing.
    sparql: |
      SELECT ?place ?findspot ?from ?to WHERE {
        ?fs a crm:E53_Place ; rdfs:label ?findspot ;
            crm:P89_falls_within ?p ; crm:P4_has_time-span ?ts .
        ?p a crm:E53_Place ; rdfs:label ?place .
        ?ts a crm:E52_Time-Span ;
            crm:P82a_begin_of_the_begin ?from ;
            crm:P82b_end_of_the_end ?to .
      }
      ORDER BY ?from

  - id: era-and-scale
    title: "Where the calendar and the arithmetic part company"
    intro: >-
      The findspots whose interval begins before the year 1. Note that
      numericPosition and inXSDgYear differ by one: xsd:gYear counts
      astronomically, so 1 BC is the year 0, whereas the source database
      counts historically and the arithmetic must stay on an unbroken
      number line. Rather than silently picking one, the graph carries both
      and declares its own time reference system for the number line.
    sparql: |
      SELECT ?site ?findspot ?numeric ?calendar ?scale WHERE {
        ?fs a lado:Findspot ; rdfs:label ?findspot ;
            crm:P89_falls_within ?p ; crm:P4_has_time-span ?ts .
        ?p rdfs:label ?site .
        ?ts time:hasBeginning ?inst .
        ?inst time:inXSDgYear ?calendar ; time:inTimePosition ?pos .
        ?pos time:numericPosition ?numeric ; time:hasTRS ?trs .
        ?trs rdfs:label ?scale .
        FILTER(?numeric < 0)
      }
      ORDER BY ?numeric

  - id: two-quality-axes
    title: "Sharply dated, but not a depot"
    intro: >-
      Findspots that are tightly dated (qInterval above 0.55) while showing
      almost no die repetition (qRepetition below 0.2) — each stamp occurs
      once or nearly once. These are exactly the sites that a single
      combined quality score would destroy: multiply the two and Rougham or
      the Keltengraben at Vindonissa drop to zero, although their dating is
      among the sharpest in the set. The two axes measure different things
      and are deliberately never merged.
    sparql: |
      SELECT ?site ?findspot ?qInterval ?qRepetition ?nStamps ?nDies ?repetition
      WHERE {
        ?fs a lado:Findspot ; rdfs:label ?findspot ;
            crm:P89_falls_within ?p ; crm:P4_has_time-span ?ts .
        ?p rdfs:label ?site .
        ?ts lado:qInterval ?qInterval ; lado:qRepetition ?qRepetition ;
            lado:nStamps ?nStamps ; lado:nDies ?nDies ;
            lado:dieRepetition ?repetition .
        FILTER(?qInterval > 0.55 && ?qRepetition < 0.2)
      }
      ORDER BY DESC(?qInterval)

  - id: findspots-per-site
    title: "Sites with more than one findspot"
    intro: >-
      Bregenz contributes four separately dated findspots; Colchester,
      London, Vindonissa and La Graufesenque two each.
      This is why the dating hangs on the findspot rather than on the site,
      and why the URI fragment is a hash of the findspot name taken per
      site: a site identifier alone could not tell the four Bregenz contexts
      apart, and they are dated differently.
    sparql: |
      SELECT ?site (COUNT(DISTINCT ?fs) AS ?findspots)
             (GROUP_CONCAT(?name; separator=" · ") AS ?names)
      WHERE {
        ?fs a lado:Findspot ; rdfs:label ?name ; crm:P89_falls_within ?p .
        ?p rdfs:label ?site .
      }
      GROUP BY ?site
      HAVING (COUNT(DISTINCT ?fs) > 1)
      ORDER BY DESC(?findspots) ?site

  - id: external-identifiers
    title: "What links out, and what does not"
    intro: >-
      Every site, with its ancient name and its Pleiades identifier where
      the source has one. The gaps are the interesting part: roughly a
      third of the sites carry no Pleiades link and most carry no Latin
      name. Absence here is recorded as absence — no placeholder is
      invented — so this query doubles as a worklist for the concordance.
    sparql: |
      SELECT ?site ?ancientName ?pleiades ?findspots WHERE {
        { SELECT ?p (COUNT(DISTINCT ?fs) AS ?findspots) WHERE {
            ?fs a lado:Findspot ; crm:P89_falls_within ?p .
          } GROUP BY ?p }
        ?p rdfs:label ?site .
        OPTIONAL { ?p lado:ancientName ?ancientName }
        OPTIONAL { ?p lado:pleiadesID  ?pleiades }
      }
      ORDER BY ?site

  - id: allen-possible
    title: "What came before what — the complete matrix"
    intro: >-
      Every pair of datings stands in exactly one of Allen's thirteen
      relations, computed on the modelled interval [eff_start, eff_end] and
      published under <code>lado:possibly*</code>. Complete means countable:
      the numbers below add up to all 820 pairs of 41 findspots, so a
      missing relation is a missing pair rather than a silence that could
      mean anything. Note how lopsided the result is — two thirds of all
      pairs are simple precedence, which is what a corpus spread over three
      centuries looks like.
    sparql: |
      SELECT ?relation (COUNT(*) AS ?pairs) WHERE {
        ?a ?relation ?b .
        ?a a lado:FindspotDating .
        ?b a lado:FindspotDating .
        FILTER(STRSTARTS(STR(?relation), CONCAT(STR(lado:), "possibly")))
      }
      GROUP BY ?relation
      ORDER BY DESC(?pairs)

  - id: allen-time-only
    title: "The same question in OWL-Time alone"
    intro: >-
      No <code>lado:</code> predicate appears below — only OWL-Time's own
      interval relations. It works, and it deliberately returns FEWER pairs
      than the query above. OWL-Time relations are sharp: there is no way to
      say "before, probably". So only the relations that survive a more
      generous reading of the bounds are asserted with them, and the rest
      live under <code>lado:possibly*</code> where the hedge is visible.
      This is not OWL-Time falling short. It is a vocabulary without a
      notion of uncertainty saying exactly as much as it can support — and
      the gap between the two counts is the uncertainty, made countable.
    sparql: |
      SELECT ?relation (COUNT(*) AS ?pairs) WHERE {
        ?a ?relation ?b .
        ?a time:hasBeginning ?ab .
        ?b time:hasBeginning ?bb .
        FILTER(STRSTARTS(STR(?relation), CONCAT(STR(time:), "interval")))
      }
      GROUP BY ?relation
      ORDER BY DESC(?pairs)

  - id: allen-unstable
    title: "Where the two readings disagree"
    intro: >-
      The pairs whose relation holds on the modelled boxes but not once the
      intervals are widened to the full span of their potters' date ranges.
      These are exactly the statements a sharp vocabulary should not make:
      draw any of these two findspots with their stubs and the asserted
      order stops being visible. Roughly half the matrix sits here, which is
      worth knowing before anyone builds a seriation on it.
    sparql: |
      SELECT ?siteA ?findspotA ?siteB ?findspotB ?fromA ?toA ?fromB ?toB
      WHERE {
        ?tsA lado:possiblyBefore ?tsB .
        FILTER NOT EXISTS { ?tsA time:intervalBefore ?tsB }
        ?fsA crm:P4_has_time-span ?tsA ; rdfs:label ?findspotA ;
             crm:P89_falls_within/rdfs:label ?siteA .
        ?fsB crm:P4_has_time-span ?tsB ; rdfs:label ?findspotB ;
             crm:P89_falls_within/rdfs:label ?siteB .
        ?tsA lado:avgDatemin ?fromA ; lado:avgDatemax ?toA .
        ?tsB lado:avgDatemin ?fromB ; lado:avgDatemax ?toB .
      }
      ORDER BY ?fromA ?fromB
      LIMIT 40

  - id: map-layer
    title: "Everything a map needs, in one query"
    intro: >-
      Coordinates, interval and colour for each findspot. The point sits on
      the discovery site rather than the findspot, because that is where the
      source records it — the four Bregenz contexts share one coordinate, and
      a map that wants them apart has to spread them itself rather than
      pretend the data distinguishes them. The colour is presentation and is
      published as such, on the plot row alongside the other "visual only"
      quantities, never on the time-span.
    sparql: |
      SELECT ?site ?findspot ?wkt ?from ?to ?norm ?colour WHERE {
        ?fs a lado:Findspot ; rdfs:label ?findspot ;
            crm:P89_falls_within ?p ; crm:P4_has_time-span ?ts .
        ?p rdfs:label ?site ; geo:hasGeometry/geo:asWKT ?wkt .
        ?ts time:hasBeginning/time:inTimePosition/time:numericPosition ?from ;
            time:hasEnd/time:inTimePosition/time:numericPosition ?to .
        ?row lado:renders ?ts ;
             lado:normQInterval ?norm ; lado:hexQInterval ?colour .
      }
      ORDER BY ?from

  - id: colour-axes
    title: "How the colours were made"
    intro: >-
      A colour in a dataset is usually an assertion nobody can check. These
      can be: each axis publishes its ramp stops, its interpolation and the
      domain the values were stretched onto, so any hex value in the graph
      can be recomputed from the graph alone. Watch
      <code>lado:domainBasis</code> — an observed domain is read off this
      corpus, which means adding a findspot can change the colour of one
      that did not change at all. The chronological axis avoids red-green on
      purpose: late material is not worse material.
    sparql: |
      SELECT ?axis ?source ?ramp ?scale ?basis ?min ?max ?stops WHERE {
        ?a a lado:ColourAxis ; lado:colourSource ?source ;
           lado:rampName ?ramp ; lado:rampStops ?stops ;
           lado:domainScale ?scale ; lado:domainBasis ?basis ;
           lado:domainMin ?min ; lado:domainMax ?max .
        BIND(REPLACE(STR(?a), "^.*/", "") AS ?axis)
      }
      ORDER BY ?axis

  - id: provenance
    title: "Which method produced these dates"
    intro: >-
      The parameters are in the graph, not only in the paper. Each dating
      is generated by an activity, and that activity records the plan it
      followed — so a consumer can ask what k, τ, t₀ and the era
      convention were, and which datemax values the source query excluded,
      without reading any prose. τ and lado:referenceLength are unrelated
      quantities that happened to carry the same value until τ was
      calibrated: τ governs how fast the interval tightens as stamps
      accumulate, t₀ is the fixed length against which qStart and qEnd are
      read. lado:calibrationBasis says how τ was obtained, and
      lado:calibratedAgainst names the findspots it was fitted to — try
      following those IRIs. The excluded datemax values are an inherited
      filter
      whose justification is still open; publishing them is how that stays
      visible.
    sparql: |
      SELECT ?software ?model ?kMin ?kMax ?tau ?t0 ?w ?era
             (GROUP_CONCAT(DISTINCT STR(?ex); separator=", ") AS ?excludedDatemax)
             (COUNT(DISTINCT ?ts) AS ?datings)
      WHERE {
        ?ts a lado:FindspotDating ; prov:wasGeneratedBy ?act .
        ?act crm:P33_used_specific_technique ?m ;
             crm:P14_carried_out_by ?agent .
        ?agent rdfs:label ?software .
        ?m rdfs:label ?model ; lado:kMin ?kMin ; lado:kMax ?kMax ;
           lado:tau ?tau ; lado:referenceLength ?t0 ;
           lado:volumeWeight ?w ; lado:eraConvention ?era ;
           lado:excludedDatemax ?ex .
      }
      GROUP BY ?software ?model ?kMin ?kMax ?tau ?t0 ?w ?era
